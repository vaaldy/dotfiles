[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
dimensions = { columns = 100, lines = 30 }
dynamic_padding = true
decorations = "Full"
opacity = 0.95
title = "Alacritty"
class = { instance = "Alacritty", general = "Alacritty" }
decorations_theme_variant = "Dark"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 12

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "0x201A28"  # Dark purple-gray background
foreground = "0xE2D8F0"  # Soft lavender-tinged white text

[colors.normal]
black =   "0x3B4252"
red =     "0xBF616A"
green =   "0xFFD000"  # High-contrast yellow
yellow =  "0xEBCB8B"
blue =    "0xC77DFF"  # High-contrast violet
magenta = "0xB48EAD"
cyan =    "0xE0AAFF"  # High-contrast pastel violet
white =   "0xE5E9F0"

[colors.bright]
black =   "0x4C566A"
red =     "0xBF616A"
green =   "0xFFE600"  # High-contrast bright yellow
yellow =  "0xEBCB8B"
blue =    "0xC77DFF"  # Electric neon purple
magenta = "0xB48EAD"
cyan =    "0xE0AAFF"  # Bright pastel violet (replaces light blue-cyan)
white =   "0xECEFF4"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = { shape = "Underline", blinking = "Off" }
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true
bindings = [
{ mouse = "Middle", mods = "None", action = "PasteSelection" },
]

[keyboard]
bindings = [
{ key = "Enter", mods = "Super", chars = "\u000a" },
{ key = "Enter", mods = "Shift", chars = "\u000a" },
{ key = "Enter", mods = "Alt", chars = "\u000a" },
{ key = "Paste", mods = "None", action = "Paste" },
{ key = "Copy", mods = "None", action = "Copy" },
{ key = "PageUp", mods = "Shift", mode = "~Alt", action = "ScrollPageUp" },
{ key = "PageDown", mods = "Shift", mode = "~Alt", action = "ScrollPageDown" },
{ key = "Home", mods = "Shift", mode = "~Alt", action = "ScrollToTop" },
{ key = "End", mods = "Shift", mode = "~Alt", action = "ScrollToBottom" },
{ key = "V", mods = "Control|Shift", action = "Paste" },
{ key = "C", mods = "Control|Shift", action = "Copy" },
{ key = "F", mods = "Control|Shift", action = "SearchForward" },
{ key = "B", mods = "Control|Shift", action = "SearchBackward" },
{ key = "C", mods = "Control|Shift", mode = "Vi", action = "ClearSelection" },
{ key = "Key0", mods = "Control", action = "ResetFontSize" },
]
