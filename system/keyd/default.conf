# /etc/keyd/default.conf
#
# Source of truth: ~/dotfiles/system/keyd/default.conf
#   install:  sudo install -Dm644 ~/dotfiles/system/keyd/default.conf /etc/keyd/default.conf && sudo keyd reload
#   undo:     sudo sed -i '/^leftalt/d' /etc/keyd/default.conf && sudo keyd reload
#
# PANIC: if a config ever locks you out, hold Backspace + Escape + Enter
# together and keyd terminates, restoring the raw keyboard.

[ids]
*

[main]

# ── Cmd key ────────────────────────────────────────────────────────────
# The physical Alt key sits where Cmd does on a Mac:
#
#   Mac:  Ctrl │ Option │  Cmd  │ ── Space ──
#   PC:   Ctrl │ Super  │  Alt  │ ── Space ──
#
# Make it send Ctrl, so Cmd+A / Cmd+C / Cmd+V / Cmd+X / Cmd+Z / Cmd+S
# do what they do on macOS. Nothing else moves:
#
#   far-left Ctrl  still Ctrl   (same position as on a Mac)
#   Super          still Super  (niri's Mod — all your bindings unchanged)
#   right Alt      still Alt    (keeps Alt available for apps and readline)
#
# Your existing Ctrl+C habits keep working too, so there is no hard
# cutover — both keys do the same thing while you retrain.

leftalt = leftcontrol

# ── Existing remaps, preserved ─────────────────────────────────────────
copilot  = rightcontrol
leftmeta = leftmeta
