# /etc/keyd/default.conf
#
# Source of truth lives in ~/dotfiles/system/keyd/default.conf.
# Install with:  sudo install -Dm644 ~/dotfiles/system/keyd/default.conf /etc/keyd/default.conf && sudo keyd reload
#
# PANIC: if a bad config ever locks you out, hold  Backspace + Escape + Enter
# together and keyd terminates, restoring the raw keyboard.

[ids]
*

[main]

# ── Positional Cmd/Option swap ─────────────────────────────────────────
# Put Cmd under the thumb where a Mac has it.
#
#   Mac:  Ctrl │ Option │  Cmd  │ ── Space ──
#   PC:   Ctrl │ Super  │  Alt  │ ── Space ──
#
# So the physical Alt key must send Meta (which niri reads as "Mod" = Cmd),
# and the physical Super key must send Alt (= Option).

leftalt   = leftmeta
leftmeta  = leftalt

# Right of the spacebar this laptop has only Alt, which sits in the same
# place as a MacBook's right Cmd. There is no right Option as a result.
# Note: this also removes AltGr. Harmless on a plain US layout.
rightalt  = rightmeta

# ── Existing remap, preserved ──────────────────────────────────────────
copilot   = rightcontrol
