# Video output (niri is Wayland; amdgpu on this host)
vo=gpu-next
gpu-context=wayland
hwdec=auto-safe
profile=gpu-hq

# Screenshots
screenshot-directory=~/Pictures/mpv-screenshots
screenshot-format=png

# OSC
osc = no

# Playback behavior
save-position-on-quit
keep-open=yes

# Audio/subtitle track preference: Japanese audio, English subs.
# Comma-separated fallback list to catch differing language-tag conventions
# across releases (some tag "jpn", some "ja"; "eng" vs "en").
alang=jpn,ja,jp
slang=eng,en

# Subtitles
sub-auto=fuzzy
sub-font-size=40
sub-pos=100

# ModernZ temporarily raises sub-pos/osd-margin-y to keep subtitles clear of
# the OSC; without this, save-position-on-quit bakes that raised value into
# the watch-later file and every resume starts with subs stuck too high.
watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y

# Upscaling: Anime4K mode A, single upscale pass (stock mode-A chains two
# Upscale passes to guarantee 4x total, built for 480p->4K; a single x2 pass
# already exceeds this 1440p monitor from any 1080p/720p source, so the
# second pass is dropped — that's what was actually causing the drops, more
# than shader tier).
#
# Restore runs on the small pre-upscale frame; Upscale runs on the 2x/4-times-
# the-pixels output. Restore's CNN size is cheap to scale up, Upscale's is
# not (each tier step ~doubles cost, and it's paid on 4x more pixels) — so
# the free detail win is bumping Restore up while keeping Upscale small.
# Restore=L + Upscale=M here; try Restore=VL if this still has headroom.
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_L.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"

# Chroma is quarter-resolution, so a sharper chroma scaler is essentially
# free — small extra detail with no measurable GPU cost.
cscale=ewa_lanczossharp
