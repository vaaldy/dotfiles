# Shared sesh picker and workstream labeling.
unbind e
bind W command-prompt -l -p 'Workstream | note (blank clears):' -I '#{@sesh_work}' { set-option -w @sesh_work '%%' }
bind s run-shell "if ! command -v sesh >/dev/null || ! command -v fzf-tmux >/dev/null || ! command -v python3 >/dev/null; then
  tmux display-message 'prefix s requires sesh, fzf-tmux, and python3'
  exit 0
fi
selection=\"\$(
  python3 ~/.config/tmux/sesh-agent-list.py | fzf-tmux -p 80%,60% -- \
    --no-sort --ansi --with-shell 'sh -c' --delimiter '[[:blank:]]*\t' --with-nth 1 --accept-nth -1 --border-label ' sesh ' --prompt '⚡  ' \
    --preview 'python3 ~/.config/tmux/sesh-agent-list.py --work-preview {-1}' --preview-window 'left,35%,wrap' --preview-label ' Workstreams ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(python3 ~/.config/tmux/sesh-agent-list.py)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(python3 ~/.config/tmux/sesh-agent-list.py -t)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(entry={-1}; if [ \"\${entry%% *}\" = '' ]; then tmux kill-session -t \"=\${entry#* }\"; fi)+change-prompt(⚡  )+reload(python3 ~/.config/tmux/sesh-agent-list.py)'
)\"
[ -n \"\$selection\" ] && sesh connect \"\$selection\""
