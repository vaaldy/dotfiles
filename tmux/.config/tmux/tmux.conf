# ~/.config/tmux/tmux.conf
#
# Ported from the macOS setup. Prefix is C-Space. Zero Alt bindings live in this
# file, and niri binds everything on Mod (Super) — so the two never collide.
#
# Linux note: Ctrl-Space is the default toggle for fcitx5 / ibus input methods.
# If tmux feels deaf, check with:  pgrep -x fcitx5; pgrep -x ibus-daemon
# Either unbind it there, or swap the prefix to C-a on the two lines below.

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- sane defaults ----------------------------------------------------------
set -g default-shell /usr/bin/fish               # fish is the login shell here
set -g default-terminal "tmux-256color"
# Alacritty sets TERM=xterm-256color (alacritty.toml:7), so the truecolor
# feature has to be keyed on that, not on "alacritty" — the macOS config keyed
# it on "alacritty" and silently never matched. Both listed so either works.
set -ag terminal-features ",xterm-256color:RGB"
set -ag terminal-features ",alacritty:RGB"
# Undercurl + colored underlines, so LSP diagnostics render as squiggles
# rather than flat underlines inside tmux.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -sg escape-time 10                          # nvim ESC latency
set -g focus-events on                          # nvim autoread / autosave
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off                    # hop to another session, don't exit
set -g set-clipboard on
set -g status-position top
set -g allow-passthrough on                     # image/OSC-52 friendly

# --- reload -----------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- splits & windows -------------------------------------------------------
# Mnemonic: | is a vertical line, - is a horizontal one. Both inherit cwd.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind X kill-pane
bind Q confirm-before -p "kill session #S? (y/n)" kill-session

# --- seamless nvim <-> tmux pane navigation (no Alt, no plugin manager) ------
# Requires christoomey/vim-tmux-navigator on the nvim side (it's in the config).
#
# The upstream (and macOS) version of this shells out on EVERY C-hjkl press:
#     is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '...'"
#     bind-key -n 'C-h' if-shell "$is_vim" ...
# That is a fork of ps plus a fork of grep per keystroke — the reason pane
# switching feels sluggish. tmux can answer the same question itself:
# #{m/ri:PATTERN,STRING} is a case-insensitive regex match, and `if-shell -F`
# evaluates its argument as a FORMAT rather than handing it to sh. Zero forks,
# so the keypress is instant.
is_vim="#{m/ri:^(\\S+/)?g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}"
bind-key -n 'C-h' if-shell -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell -F "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# resize with prefix + HJKL (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z

# --- copy mode: vi keys, wl-copy --------------------------------------------
# Wayland session, so wl-copy replaces macOS pbcopy. wl-clipboard is installed.
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# --- git --------------------------------------------------------------------
# g  lazygit popup
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
# C-g  paged review of everything uncommitted. git's own pager (less) holds the
# popup open, so no shell-specific `read -n1` hack — that one was bash-only and
# would break under fish, which is what tmux spawns here.
bind C-g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" \
  "git diff HEAD --stat --patch"

# --- navigation -------------------------------------------------------------
# s / w  session + window pickers
bind s choose-tree -Zs
bind w choose-tree -Zw
# Space  last session (the alt-tab of projects)
bind Space switch-client -l
# Tab / S-Tab  cycle sessions in order
bind Tab   switch-client -n
bind BTab  switch-client -p

# !@#$ (Shift+1..4)  jump straight to the Nth SESSION, VSCode-window-picker
# style. `cut -d: -f1` rather than -F '#{session_name}' on purpose:
# run-shell expands #{...} itself before sh ever sees it, which would
# collapse every line to the current session's name.
bind '!' run-shell 'tmux switch-client -t "$(tmux list-sessions | sed -n 1p | cut -d: -f1)"'
bind '@' run-shell 'tmux switch-client -t "$(tmux list-sessions | sed -n 2p | cut -d: -f1)"'
bind '#' run-shell 'tmux switch-client -t "$(tmux list-sessions | sed -n 3p | cut -d: -f1)"'
bind '$' run-shell 'tmux switch-client -t "$(tmux list-sessions | sed -n 4p | cut -d: -f1)"'

# --- know when a background job wants you -----------------------------------
# Something finishing in a session you're not looking at marks that window.
setw -g monitor-activity on
setw -g monitor-bell on
set  -g visual-activity off
set  -g visual-bell off
set  -g bell-action other

# --- status line ------------------------------------------------------------
# Recolored from the macOS Tokyo Night original to the noctalia purple palette
# in ~/.config/alacritty/themes/noctalia.toml, so tmux sits on the terminal
# background instead of fighting it.
#   #201A28 bg   #E2D8F0 fg   #9D4EDD purple   #C77DFF neon   #E0AAFF violet
#   #FFD000 yellow   #BF616A red
set -g status-style "bg=#2A2136,fg=#8B7BA3"
set -g status-left-length 40
# Current session, then every OTHER session — so several projects are visible
# at a glance from one Alacritty window. A session with activity shows yellow.
set -g status-left "#[fg=#C77DFF,bold] #S #[fg=#4A3D5C]│#[default]"
set -g status-right-length 100
set -g status-right "#{?client_prefix,#[fg=#FFD000]PREFIX ,}#[fg=#7B6B8F]#(tmux list-sessions -f '##{?session_attached,0,1}' -F '##{session_name}' 2>/dev/null | tr '\\n' ' ')#[fg=#4A3D5C]│ #[fg=#7B6B8F]%H:%M "
setw -g window-status-format "#[fg=#7B6B8F] #I:#W "
setw -g window-status-current-format "#[fg=#E0AAFF,bold] #I:#W#{?window_zoomed_flag, ,} "
setw -g window-status-activity-style "fg=#FFD000,bold"
setw -g window-status-bell-style "fg=#BF616A,bold"
set -g pane-border-style "fg=#382E47"
set -g pane-active-border-style "fg=#9D4EDD"
set -g message-style "bg=#2A2136,fg=#E2D8F0"

