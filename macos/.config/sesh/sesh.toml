# ~/.config/sesh/sesh.toml

# Pinned config bookmarks (accessible via Ctrl-g in sesh picker)
[[session]]
name = "term-agentic (dotfiles)"
path = "~/Documents/term-agentic"

[[session]]
name = "nvim config"
path = "~/.config/nvim"

