# ~/.config/alacritty/alacritty.toml
#
# macOS + yabai. Keep both Option keys available to skhd/yabai:
#
#   option_as_alt = "None"
#
# Option stays a plain macOS modifier, so yabai/skhd keep full ownership of
# Opt+A / Opt+D / Opt+R (+Shift), and Option combinations do not reach the
# shell or nvim as Alt/Meta input.

[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
option_as_alt = "None"
decorations = "Buttonless"
dynamic_padding = true
padding = { x = 8, y = 8 }
opacity = 0.92
blur = true
# yabai tiles the window; don't let Alacritty fight it over startup geometry.
startup_mode = "Windowed"
dynamic_title = true

[scrolling]
history = 50000
multiplier = 3

[font]
size = 14.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
# macOS renders thin; nudge if it looks cramped.
offset = { x = 0, y = 1 }

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# --- Tokyo Night Storm ------------------------------------------------------
[colors.primary]
background = "#24283b"
foreground = "#c0caf5"

[colors.cursor]
text = "#24283b"
cursor = "#c0caf5"

[colors.normal]
black   = "#1d202f"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[colors.selection]
text = "CellForeground"
background = "#364a82"

# --- Keys -------------------------------------------------------------------
# Deliberately sparse. Anything Alt-based is left free for yabai; anything
# pane/window related is tmux's job, not the emulator's.
[keyboard]
bindings = [
  # Cmd stays macOS-native and never collides with yabai's Option binds.
  { key = "N",      mods = "Command",       action = "CreateNewWindow" },
  # Claude Code treats LF like Ctrl-J as a multiline prompt newline.
  { key = "Return", mods = "Command",       chars = "\u000a" },
  { key = "K",      mods = "Command",       action = "ClearHistory" },
  { key = "Equals", mods = "Command",       action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Command",       action = "DecreaseFontSize" },
  { key = "Key0",   mods = "Command",       action = "ResetFontSize" },
  { key = "F",      mods = "Command",       action = "SearchForward" },
  # Vi mode for scrollback yanking without leaving the keyboard.
  { key = "Space",  mods = "Control|Shift", action = "ToggleViMode" },
]
