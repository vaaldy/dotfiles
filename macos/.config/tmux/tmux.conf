# ~/.config/tmux/tmux.conf
#
# Prefix is C-Space. Zero Alt/Option bindings live in this file, so yabai
# keeps Opt+A / Opt+D / Opt+R (+Shift) exclusively.
#
# macOS note: Ctrl-Space is also "select previous input source" if you have
# more than one keyboard input source enabled. If tmux feels deaf, either
# uncheck it in System Settings -> Keyboard -> Keyboard Shortcuts -> Input
# Sources, or swap the prefix to C-a on the two lines below.

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- sane defaults ----------------------------------------------------------
set -g default-terminal "tmux-256color"
set -g window-size latest
setw -g aggressive-resize on
# terminal-features keys on the OUTER $TERM — the one Alacritty exports before
# tmux starts — not on default-terminal above. alacritty/alacritty.toml sets
# TERM="xterm-256color", so the alacritty:RGB line alone never matched and
# truecolor was silently degraded to 256 colours. Verified with
# `#{client_termfeatures}`: without the second line RGB is absent, with it
# present. Both kept so this still works if TERM is ever set to "alacritty".
set -ag terminal-features ",alacritty:RGB"
set -ag terminal-features ",xterm-256color:RGB"
set -sg escape-time 10                          # nvim ESC latency
set -g repeat-time 2000                         # repeat prefix bindings for 2 seconds
set -g focus-events on                          # nvim autoread / autosave
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off                    # hop to another session, don't exit
set -g set-clipboard on
set -g status-position top
set -g allow-passthrough on                     # image/OSC-52 friendly
set -g extended-keys on

# --- reload -----------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- splits & windows -------------------------------------------------------
# Mnemonic: | is a vertical line, - is a horizontal one. Both inherit cwd.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind X kill-pane
bind Q confirm-before -p "kill session #S? (y/n)" kill-session

# --- seamless nvim <-> tmux pane navigation (no Alt, no plugin manager) ------
# Requires christoomey/vim-tmux-navigator on the nvim side (it's in the config).
#
# `if-shell -F` evaluates its argument as a tmux FORMAT, not a shell command.
# The old version ran `ps | grep` on every single C-hjkl press — two forks per
# keystroke, perceptibly laggy when holding a key down. This does the same
# match natively inside tmux with zero forks. Requires tmux 3.2+ for m/ri
# (case-insensitive regex match).
is_vim="#{m/ri:^(\\S+/)?g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}"
is_input="#{||:$is_vim,#{m/ri:^(claude|claude-code|codex|opencode|pi|node|[0-9]+\\.[0-9]+\\.[0-9]+)(-.*)?$,#{pane_current_command}}}"
bind-key -n 'C-h' if-shell -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell -F "$is_input" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell -F "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# resize with prefix + HJKL (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z

# --- copy mode: vi keys, pbcopy ---------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- navigation and utility ------------------------------------------------
unbind a
unbind A
unbind t
unbind T
unbind G
unbind C-g
unbind !
unbind @
unbind \#
unbind $
bind 0 select-window -t :=0
bind 1 select-window -t :=1
bind 2 select-window -t :=2
bind 3 select-window -t :=3
bind 4 select-window -t :=4
bind 5 select-window -t :=5
bind 6 select-window -t :=6
bind 7 select-window -t :=7
bind 8 select-window -t :=8
bind 9 select-window -t :=9
bind w choose-tree -Zw
bind Space switch-client -l
bind -r Tab   switch-client -n
bind -r BTab  switch-client -p
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# --- sesh session manager (instant multi-repo switching) --------------------
bind-key "s" run-shell "sesh connect \"\$(
  sesh list --icons | fzf-tmux -p 42%,40% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)'
)\""

bind-key "f" run-shell "sesh connect \"\$(
  sesh list --icons | fzf-tmux -p 42%,40% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)'
)\""

# --- activity notifications --------------------------------------------------
# Keep activity and bell indicators available without tying them to any project
# or agent workflow.
setw -g monitor-activity on
setw -g monitor-bell on
set  -g visual-activity off
set  -g visual-bell off
set  -g bell-action other

# --- status line ------------------------------------------------------------
set -g status-style "bg=default,fg=#7f849c"
set -g status-left-length 30
# Current session, then every OTHER session — so 4 projects are visible at a
# glance from one Alacritty window. A session with activity shows in yellow.
set -g status-left "#[fg=#7aa2f7,bold] #S #[fg=#414868]│#[default]"
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=#e0af68]PREFIX ,}#[fg=#565f89]#(tmux list-sessions -f '##{?session_attached,0,1}' -F '##{session_name}' 2>/dev/null | awk 'BEGIN{max=35;out=\"\";tot=0;c=0} {tot++; if(length(out)+length(\$0)+1<=max){out=(out==\"\"?\"\":out\" \")\$0; c++}} END{if(tot>c) print out \" >\"; else print out}') #[fg=#414868]│ #[fg=#565f89]%H:%M "
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#9ece6a,bold] #I:#W#{?window_zoomed_flag, ,} "
setw -g window-status-activity-style "fg=#e0af68,bold"
setw -g window-status-bell-style "fg=#f7768e,bold"
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=default,fg=#c0caf5"
